<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillMate – Học cùng nhau. Cùng nhau tiến xa hơn.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{--indigo:#464B71;--blue:#118AB2;--mint:#7CD5C7;--mint-l:#EAF8F5;--blue-l:#E8F4F9;--line:#E3E6EE;--muted:#5d6280;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:#fff;color:var(--indigo);font:16px/1.6 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--blue)}h1,h2,h3{line-height:1.25;margin:0 0 .5em}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:#fff;border-bottom:1px solid var(--line);z-index:5}
nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:var(--indigo);text-decoration:none}
.brand img{width:38px;height:38px;object-fit:contain}
nav .links{display:flex;gap:20px;align-items:center}nav .links a{color:var(--indigo);text-decoration:none;font-size:15px;font-weight:500}
@media(max-width:720px){nav .links a:not(.btn){display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;border:2px solid var(--blue);background:var(--blue);color:#fff!important;font:600 15px inherit;font-family:inherit;cursor:pointer;text-decoration:none;transition:.15s}
.btn:hover{background:#0e7499;border-color:#0e7499}.btn:focus-visible,.chip:focus-visible,summary:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.btn.ghost{background:#fff;color:var(--blue)!important}.btn.ghost:hover{background:var(--blue-l)}
.btn.sm{padding:8px 16px;font-size:14px}.btn:disabled{opacity:.55;cursor:not-allowed}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;padding:64px 0 48px}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:36px}.hero .art{order:-1;max-width:240px}}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:700}
.hero p{font-size:18px;color:var(--muted);max-width:560px}.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.hero .art{background:var(--mint-l);border-radius:40px;padding:32px;display:flex;justify-content:center}.hero .art img{width:100%;max-width:300px}
.tag{display:inline-block;background:var(--mint-l);color:var(--indigo);padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:16px}
section{padding:56px 0}section.alt{background:var(--blue-l)}
h2{font-size:clamp(24px,3.5vw,32px)}.lead{color:var(--muted);max-width:640px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:28px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}
.card h3{font-size:18px}.card p{margin:0;color:var(--muted);font-size:15px}
.num{width:36px;height:36px;border-radius:50%;background:var(--mint);color:var(--indigo);display:grid;place-items:center;font-weight:700;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}@media(max-width:700px){.two{grid-template-columns:1fr}}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;margin:2px 4px 2px 0;background:var(--blue-l);color:var(--indigo)}
.pill.m{background:var(--mint-l)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--indigo);padding:7px 14px;border-radius:999px;font:500 14px inherit;font-family:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.demo{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;margin-top:28px}
.demo h3{font-size:16px;margin:18px 0 8px}.demo h3:first-child{margin-top:0}
.notice{background:var(--mint-l);border-radius:14px;padding:12px 16px;font-size:14px;margin-top:20px}
.res{display:grid;gap:14px;margin-top:20px}
.m-card{border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:8px}
.m-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.lvl{font-size:13px;font-weight:600;padding:3px 12px;border-radius:999px;background:var(--mint);color:var(--indigo)}.lvl.l2{background:var(--blue-l)}.lvl.l3{background:#F1F2F7}
.demo-badge{font-size:12px;color:var(--muted);border:1px dashed var(--muted);border-radius:6px;padding:1px 6px;margin-left:6px}
ul.why{margin:4px 0;padding-left:20px;color:var(--muted);font-size:14px}
.err{color:#b3261e;font-size:14px;margin-top:10px}
details{border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-top:10px;background:#fff}
summary{cursor:pointer;font-weight:600}details p{color:var(--muted);margin:8px 0 0}
footer{border-top:1px solid var(--line);padding:32px 0;color:var(--muted);font-size:14px}
footer .row{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.status{border-left:4px solid var(--blue);padding:4px 14px;margin-top:20px;color:var(--muted);font-size:14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 24px}.bar i{display:block;height:100%;background:var(--mint);transition:width .25s}
.panel{max-width:680px;margin:36px auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px}
.panel h2{font-size:24px}.nav2{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
input[type=text]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;color:var(--indigo)}input[type=text]:focus{outline:3px solid var(--mint);border-color:var(--blue)}
label{display:block;font-weight:600;margin:14px 0 6px}.row2{display:flex;gap:8px;margin-top:12px}.row2 input{flex:1}
.hello{padding:32px 0 8px}.hello h1{font-size:clamp(24px,4vw,34px);margin:0}
.cols{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start;padding-bottom:48px}@media(max-width:820px){.cols{grid-template-columns:1fr}}
.me{border:1px solid var(--line);border-radius:20px;padding:20px;background:var(--blue-l)}.me p{margin:6px 0;font-size:14px}.me .btn{margin-top:8px;width:100%}
.acts{display:flex;gap:8px;flex-wrap:wrap}.hint{color:var(--muted);font-size:14px}
.log{height:min(420px,55vh);overflow:auto;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;background:#fff}.bub{max-width:82%;padding:8px 12px;border-radius:14px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}.bub.me{align-self:flex-end;background:var(--blue);color:#fff}.bub.them{align-self:flex-start;background:var(--blue-l)}.bub small{display:block;opacity:.7;font-size:11px;margin-top:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100% - 32px);background:var(--indigo);color:#fff;padding:14px 18px;border-radius:16px;z-index:20;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stage{background:var(--blue-l);border-radius:20px;padding:20px;min-height:300px}.slide{background:#fff;border-radius:16px;padding:28px;min-height:220px;border:1px solid var(--line)}.slide h2{font-size:26px}.slide p{font-size:18px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}@media(max-width:600px){.tiles{grid-template-columns:1fr}}.tile{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}.av{flex:none;width:48px;height:48px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-weight:700}.av.off{background:var(--line);color:var(--muted)}
.ctls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px 0}.ctl{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;color:var(--indigo);padding:10px 16px;border-radius:999px;font:500 14px inherit;font-family:inherit;cursor:pointer}.ctl:focus-visible{outline:3px solid var(--mint);outline-offset:2px}.ctl.on{background:var(--mint-l);border-color:var(--mint)}.ctl.off{background:#F1F2F7}.ctl.sharing{background:var(--blue);color:#fff;border-color:var(--blue)}.ctl.leave{background:var(--indigo);color:#fff;border-color:var(--indigo)}.joinbtn{float:right;margin-left:12px}
.meet{background:#464B71;color:#fff;border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:12px;height:min(82vh,680px);min-height:480px}.meet-main{flex:1;display:grid;grid-template-columns:1fr 220px;gap:12px;min-height:0}@media(max-width:760px){.meet-main{grid-template-columns:1fr;grid-template-rows:1fr auto}.meet-side{flex-direction:row!important}.mb-r{display:none!important}.meet-bar{grid-template-columns:1fr!important}}
.meet-stage{background:#fff;color:var(--indigo);border-radius:14px;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:6px;overflow:auto;min-height:0}.meet-stage.wait{background:rgba(255,255,255,.1);color:#fff;align-items:center;text-align:center}.meet-stage h2{font-size:26px}.meet-stage p{margin:0;font-size:18px}
.meet-side{display:flex;flex-direction:column;gap:12px;min-height:0}.vt{position:relative;flex:1;min-height:100px;background:#3a3e5f;border-radius:14px;display:grid;place-items:center;overflow:hidden}.vt .av{width:64px;height:64px;font-size:24px;color:var(--indigo)}.vt .av.off{background:#5a5f86;color:#fff}.vt .nm{position:absolute;left:10px;bottom:8px;font-size:13px;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:6px}.vt .mut{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center}
.meet-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.mb-l{font-size:14px}.mb-c{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.mb-r{justify-self:end;font-size:13px}
.rb{width:48px;height:48px;border-radius:50%;border:0;background:#5a5f86;color:#fff;display:grid;place-items:center;cursor:pointer}.rb:hover{background:#6a6f98}.rb.off{background:#b3261e}.rb.on{background:var(--mint);color:var(--indigo)}.rb.leave{background:#b3261e;width:64px;border-radius:24px}.rb:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.sn{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:14px}
.mbg{position:fixed;inset:0;background:rgba(70,75,113,.5);z-index:30;overflow:auto;display:flex;padding:20px}.mdl{background:#fff;border-radius:24px;max-width:560px;width:100%;padding:24px;margin:auto}.mdl h2{font-size:22px}.q{margin:16px 0 6px;font-weight:600;font-size:15px}
.chatwrap{position:relative;min-height:560px}.chatwrap .chatbox{position:absolute;inset:0}.chatcols{align-items:stretch!important}
.chatbox{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}.chatbox .log{height:auto;flex:1;min-height:0;border:0;border-radius:0}.chatbox .row2{margin:0;padding:10px 12px;border-top:1px solid var(--line);align-items:center}.chatbox .notice{margin:0 12px 12px;font-size:13px}
.chatbar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:#fff}.cbn{flex:1;min-width:0;line-height:1.35}.cbn .hint{font-size:12px}
.ib{flex:none;border:0;background:transparent;color:var(--blue);width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center}.ib:hover{background:var(--blue-l)}.ib:focus-visible{outline:3px solid var(--mint)}.bub .fl{display:flex;align-items:center;gap:8px}
.avi{display:block;border-radius:50%;overflow:hidden;object-fit:cover;flex:none}.avi svg{width:100%;height:100%;display:block}
</style>
</head>

function prefs(m){const o={like:[],avoid:[],sw:[],keep:[]},last={};(m.fb||[]).forEach(f=>last[f.id]=f);Object.values(last).forEach(f=>{const a=f.a,p=P[f.id];if(a[3])o.like.push(a[3]);if(a[1]==="Rất phù hợp")o.like.push(p.meth);if(a[1]==="Chưa phù hợp"||a[4]==="Tiếp tục nhưng thay đổi cách học")o.avoid.push(p.meth);if(a[4]==="Thử ghép đôi với người khác")o.sw.push(f.id);if(a[4]==="Tiếp tục học cùng bạn hiện tại")o.keep.push(f.id)});return o}
function adjust(p,i,pf){let d=0;const why=[];if(pf.like.includes(p.meth)){d+=.08;why.push("Cách học "+p.meth.toLowerCase()+" phù hợp với điều bạn thích sau các buổi học")}if(pf.avoid.includes(p.meth)){d-=.08;why.push("Điều chỉnh vì bạn muốn đổi cách học")}if(pf.sw.includes(i)){d-=.3;why.push("Hạ ưu tiên vì bạn muốn thử ghép đôi với người khác")}if(pf.keep.includes(i)){d+=.1;why.push("Ưu tiên vì bạn muốn tiếp tục học cùng bạn này")}return{d,why}}
